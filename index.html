
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela inicial</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="tela_inicial">

        <!-- Perfil e configurações -->
        <div class="perfil_foto_menu">
            <div class="perfil_icone">👤</div>
        </div>

        <button class="abrir_perfil" onclick="AbrirSecao('perfil')">
            <div class="abrir_perfil_texto">Abrir perfil</div>
        </button>

        <button class="config_botaoo" onclick="AbrirSecao('configuracoes')">
            <div class="config_icone">⚙</div>
        </button>

        
        <!-- Conteúdo principal -->
        <div class="painel_tela_principal">

            <div class="fundo_texto_painel_tela_principal">
                <div class="texto_painel_tela_principal">
                    💫 O que vai escrever hoje? 🖊
                </div>
                <div class="nome_do_site">
                    Meu diário de memórias ❤
                </div>
            </div>

            <nav class="botoes_fundo_pagina_principal">

                <button class="historias_botao" onclick="AbrirSecao('historias')">
                    <div class="btn_historias">📝 Minhas Histórias</div>
                </button>

                <button class="memorias_botao" onclick="AbrirSecao('memorias')">
                    <div class="btn_memorias">💭 Minhas Memórias</div>
                </button>

                <button class="livros_botao" onclick="AbrirSecao('livros')">
                    <div class="btn_livros">📚 Livros</div>
                </button>

                <button class="filmes_botao" onclick="AbrirSecao('filmes')">
                    <div class="btn_filmes">🎬 Filmes</div>
                </button>

                <button class="compras_botao" onclick="AbrirSecao('compras')">
                    <div class="btn_compras">🛍️ Compras</div>
                </button>

                <button class="financas_botao" onclick="AbrirSecao('financas')">
                    <div class="btn_financas">💸 Finanças</div>
                </button>

                <button class="cabelos_botao" onclick="AbrirSecao('cabelos')">
                    <div class="btn_cabelos">💇‍♀️ Cabelos</div>
                </button>

                <button class="calendario_botao" onclick="AbrirSecao('calendario')">
                    <div class="btn_calendario">📅 Calendário</div>
                </button>

                <button class="autocuidado_botao" onclick="AbrirSecao('autocuidado')">
                    <div class="btn_autocuidado">🌸 Autocuidado</div>
                </button>

                <button class="crriar_novo_botao" onclick="AbrirSecao('criar_secao')">
                    <div class="btn_autocuidado">➕ Criar Novo</div>
                </button>

            </nav>
        </div>

    </section>

</body>
</html>
