<!DOCTYPE html>
<html lang="pt.br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Sair</title>
</head>
<body>

    
    <dialog class="janela_sair_conta" id="dialog_sair_conta">

        <div class="botao_exit">🚪</div>

        <button class="sair_icone" type="button"
            onclick="FecharDialogSair()">
            <div class="sair_icone_texto">✖</div>
        </button>

        <div class="confirmacao_sair_da_conta">
            Sair da conta?
        </div>

        <div class="confirmacao_sair">
            Tem certeza que deseja sair da sua conta?
        </div>

        <button class="sair_botao" type="button"
            onclick="SairConta()">
            <div class="sair_texto">Sair</div>
        </button>

        <button class="cancelar_sair_botao" type="button"
            onclick="FecharDialogSair()">
            <div class="cancelar_sair_texto">Cancelar</div>
        </button>

    </dialog>

    

</body>
</html>
