<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tela inicial</title>
</head>
<body>

    <section class="tela_inicial">

        <div class="menu_topo_tela_inicial">
    
            <button class="perfil_botao" onclick="AbrirSecao('perfil')">
                <div class="perfil_icone">👤</div>
            </button>
    
            <button class="ver_perfil_foto" onclick="AbrirSecao('foto_perfil')">
                <img src="" alt="Foto de perfil">
            </button>
    
            <button class="config_botao" onclick="AbrirSecao('configuracoes')">
                <div class="config_icone">⚙</div>
            </button>
    
            <div class="nome_do_site">Meu diário de memórias ❤</div>
            <div class="nome_menu">Nome</div>
            <div class="idade_menu">Idade</div>
            <div class="altura_menu">Altura</div>
            <div class="peso_menu">Peso</div>
    
        </div>
    
        <main>
    
            <nav class="painel_tela_principal">
    
                <div class="texto_painel_tela_principal">MEU DIÁRIO ✨</div>
    
                <button class="historias_botao" onclick="AbrirSecao('historias')">
                    <div class="historias">📝 Minhas Histórias</div>
                </button>
    
                <button class="memorias_botao" onclick="AbrirSecao('memorias')">
                    <div class="memorias">💭 Minhas Memórias</div>
                </button>
    
                <button class="livros_botao" onclick="AbrirSecao('livros')">
                    <div class="livros">📚 Livros</div>
                </button>
    
                <button class="filmes_botao" onclick="AbrirSecao('filmes')">
                    <div class="filmes">🎬 Filmes</div>
                </button>
    
                <button class="compras_botao" onclick="AbrirSecao('compras')">
                    <div class="compras">🛍️ Compras</div>
                </button>
    
                <button class="financas_botao" onclick="AbrirSecao('financas')">
                    <div class="financas">💸 Finanças</div>
                </button>
    
                <button class="cabelos_botao" onclick="AbrirSecao('cabelos')">
                    <div class="cabelos">💇‍♀️ Cabelos</div>
                </button>
    
                <button class="calendario_botao" onclick="AbrirSecao('calendario')">
                    <div class="calendario">📅 Calendário</div>
                </button>
    
                <button class="autocuidado_botao" onclick="AbrirSecao('autocuidado')">
                    <div class="autocuidado">🌸 Autocuidado</div>
                </button>
    
            </nav>
    
        </main>
    
    </section>
</body>
</html>
